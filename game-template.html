    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GAME_TITLE — SYS://ARCADE.NET" />

    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link href="https://use.typekit.net/iba0kyn.css" rel="stylesheet" />
    <link rel="preload" href="/assets/fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="/shared/tokens.css" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/games/GAME_SLUG/game.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050508'/%3E%3Crect x='3' y='3' width='10' height='10' fill='none' stroke='%23GAME_FAVICON_HEX' stroke-width='2'/%3E%3C/svg%3E"
    />
  </head>
  <body data-page="game" data-accent="GAME_ACCENT">
    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main" class="wrap stage-page">
      <div class="stage-bar">
        <a class="backlink" href="/">[&lt; ESCAPE TO DIRECTORY]</a>
        <h1 class="stage-bar__title">GAME_TITLE</h1>
        <span class="stage-bar__meta">
          <span>SESSION T+<b data-session-clock>00:00</b></span>
          <button class="hbtn" type="button" data-fullscreen-toggle aria-pressed="false" aria-controls="stage">FULLSCREEN</button>
        </span>
      </div>

      <div class="stage" id="stage">
        <span class="xh tl" aria-hidden="true">+</span>
        <span class="xh tr" aria-hidden="true">+</span>
        <span class="xh bl" aria-hidden="true">+</span>
        <span class="xh br" aria-hidden="true">+</span>
      </div>

      <div class="console">
        <span class="console__group"><span class="console__label">HOW TO PLAY</span><span>GAME_INSTRUCTIONS</span></span>
        <span class="console__group"><span class="console__label">KEYS</span><span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span><span>MOVE</span></span>
        <span class="console__group"><button class="btn btn--sm" type="button" data-game-pause aria-pressed="false">PAUSE</button><button class="btn btn--sm" type="button" data-game-reset>RESET</button></span>
      </div>
    </main>

    <script type="module" src="/games/GAME_SLUG/game.js"></script>

    <script type="module">
      import { initShell } from "/shared/shell.js";
      initShell();

      const clockEl = document.querySelector("[data-session-clock]");
      const started = Date.now();
      if (clockEl && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        setInterval(() => {
          if (document.hidden) return;
          const s = Math.floor((Date.now() - started) / 1000);
          clockEl.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
        }, 1000);
      }

      const fsBtn = document.querySelector("[data-fullscreen-toggle]");
      const stage = document.getElementById("stage");
      if (!document.fullscreenEnabled || !stage) {
        fsBtn?.remove();
      } else {
        fsBtn.addEventListener("click", () => {
          if (document.fullscreenElement) {
            document.exitFullscreen?.()?.catch?.(() => {});
          } else {
            stage.requestFullscreen?.()?.catch?.(() => {});
          }
        });
        document.addEventListener("fullscreenchange", () => {
          fsBtn.setAttribute("aria-pressed", String(Boolean(document.fullscreenElement)));
        });
      }
    </script>
  </body>
</html>
