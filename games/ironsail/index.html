<!doctype html>
<html lang="en" data-accent="teal" class="crt-on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IRONSAIL — SYS://TIMESINK.NET</title>
    <meta name="description" content="Open-sea naval conquest and trading: a 14 km archipelago of 30 islands, pirate raiders solo and in packs, island forts, storms, and two legendary bosses." />
    <meta name="theme-color" content="#02121a" />
    <link rel="stylesheet" href="/shared/tokens.css" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/src/games/ironsail/game.css" />
  </head>
  <body data-page="game" data-accent="teal">
    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main" class="wrap stage-page">
      <div class="stage-bar">
        <a class="backlink" href="/">[&lt; ESCAPE TO DIRECTORY]</a>
        <h1 class="stage-bar__title">IRONSAIL // NAVAL CONQUEST &amp; TRADE</h1>
        <span class="stage-bar__meta">
          <span>SESSION T+<b data-session-clock>00:00</b></span>
        </span>
      </div>

      <div class="is-screen">
        <div class="is-stage">
          <canvas id="is-canvas" width="1600" height="900" tabindex="0" aria-label="Open sea"></canvas>
          <div class="is-modal" id="is-modal" role="dialog" aria-label="Ironsail"></div>
        </div>
        <div class="console">
          <span class="console__group"><span class="console__label">STEER</span><span class="kbd">A</span><span class="kbd">D</span><span>OR HOLD MOUSE</span></span>
          <span class="console__group"><span class="console__label">SAILS</span><span class="kbd">W</span><span class="kbd">S</span></span>
          <span class="console__group"><span class="console__label">ALL HANDS</span><span class="kbd">SPACE</span></span>
          <span class="console__group"><span class="console__label">CANNONS</span><span>AUTO BROADSIDES</span></span>
          <span class="console__group"><span class="console__label">PORT</span><span class="kbd">E</span></span>
          <span class="console__group"><span class="console__label">CHART</span><span class="kbd">M</span></span>
          <span class="console__group"><span class="console__label">PAUSE</span><span class="kbd">ESC</span></span>
        </div>
      </div>
    </main>

    <script type="module" src="/src/games/ironsail/game.js"></script>

    <script type="module">
      const clockEl = document.querySelector("[data-session-clock]");
      const started = Date.now();
      if (clockEl && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        setInterval(() => {
          if (document.hidden) return;
          const s = Math.floor((Date.now() - started) / 1000);
          clockEl.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
        }, 1000);
      }
    </script>
  </body>
</html>
