<!doctype html>
<html lang="en" data-accent="rust">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mars Base — Time Sink</title>
    <meta
      name="description"
      content="A turn-based Mars colony tycoon. Manage power, water, oxygen, ore and credits across sols, survive dust storms and meteors, and grow a self-sustaining colony of fifty."
    />
    <meta name="theme-color" content="#0b0e1a" />
    <link rel="canonical" href="https://timesink.vercel.app/games/mars-base" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Time Sink" />
    <meta property="og:title" content="Mars Base — a turn-based colony tycoon" />
    <meta
      property="og:description"
      content="Build a colony one sol at a time. Oxygen is a suggestion until it isn't."
    />
    <meta property="og:url" content="https://timesink.vercel.app/games/mars-base" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/shared/tokens.css" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/games/mars-base/game.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230b0e1a'/%3E%3Cpath d='M12 4c3 2.4 4.7 5.8 4.7 9.2L12 17l-4.7-3.8C7.3 9.8 9 6.4 12 4Z' fill='none' stroke='%23ff6b35' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body data-page="game" data-accent="rust">
    <main id="main" class="game wrap">
      <section class="hud">
        <div class="hud__sol"><small>Sol</small><span id="sol">1</span></div>
        <div class="hud__stat" title="Population / capacity">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.4a3.2 3.2 0 0 1 0 5.2"/><path d="M18.5 20a6 6 0 0 0-2.6-4.9"/></svg>
          <span id="pop">2/4</span>
        </div>
        <div class="hud__badges">
          <span id="doctrine-badge"></span>
          <span id="mode-badge"></span>
        </div>
        <div class="hud__status" id="status-banner"></div>
      </section>

      <section class="resources" id="resources" aria-label="Resources" aria-live="polite"></section>

      <div class="layout">
        <section class="panel" aria-label="Structures">
          <div class="panel__head"><span class="panel__title">Structures</span></div>
          <div class="buildings__list" id="buildings"></div>
        </section>

        <aside class="side">
          <section class="panel" aria-label="Controls">
            <div class="panel__body controls">
              <button id="btn-advance" type="button" class="btn btn--primary controls__primary">
                Advance Sol <span class="kbd">Space</span>
              </button>
              <div class="controls__row">
                <button id="btn-undo" type="button" class="btn">Undo <span class="kbd">U</span></button>
                <button id="btn-help" type="button" class="btn btn--ghost">Help <span class="kbd">?</span></button>
              </div>
              <div class="controls__row controls__row--tight">
                <button id="btn-export" type="button" class="btn btn--ghost btn--sm">Export</button>
                <button id="btn-import" type="button" class="btn btn--ghost btn--sm">Import</button>
                <button id="btn-daily" type="button" class="btn btn--ghost btn--sm">Daily</button>
              </div>
              <button id="btn-reset" type="button" class="btn btn--danger btn--sm">Abandon colony</button>
            </div>
          </section>

          <section class="panel" aria-label="Next sol preview">
            <div class="panel__head"><span class="panel__title">Next sol preview</span></div>
            <div class="panel__body">
              <div id="preview-rows"></div>
              <div id="preview-notes"></div>
              <div id="win-progress"></div>
            </div>
          </section>

          <section class="panel" aria-label="Colony log">
            <div class="panel__head"><span class="panel__title">Colony log</span></div>
            <ul class="log__list" id="log"></ul>
          </section>
        </aside>
      </div>
    </main>

    <script type="module" src="/games/mars-base/ui.js"></script>
  </body>
</html>
