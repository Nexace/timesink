<!doctype html>
<html lang="en" data-accent="flare" class="crt-on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MARS BASE — SYS://TIMESINK.NET</title>
    <meta
      name="description"
      content="Stranded on Mars. An open-world pixel-art survival game: gather regolith and ice, patch the hab, grow potatoes, drive the rover across a seeded red planet, and build a colony."
    />
    <meta name="theme-color" content="#050303" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://timesink.vercel.app/games/mars-base" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SYS://TIMESINK.NET" />
    <meta property="og:title" content="MARS BASE — SYS://TIMESINK.NET" />
    <meta property="og:description" content="The crew left. You didn't. Science your way off a very red planet." />
    <meta property="og:url" content="https://timesink.vercel.app/games/mars-base" />
    <meta property="og:image" content="https://timesink.vercel.app/assets/mars-base-og.png" />
    <meta property="og:image:alt" content="MARS BASE — open-world pixel survival on Mars" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MARS BASE — SYS://TIMESINK.NET" />
    <meta name="twitter:description" content="The crew left. You didn't. Science your way off a very red planet." />
    <meta name="twitter:image" content="https://timesink.vercel.app/assets/mars-base-og.png" />
    <link rel="stylesheet" href="/shared/tokens.css" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/games/mars-base/game.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050508'/%3E%3Cpath d='M4 13V9a4 4 0 0 1 8 0v4' fill='none' stroke='%23FF4900' stroke-width='2'/%3E%3Crect x='7' y='5' width='2' height='2' fill='%23FF4900'/%3E%3C/svg%3E"
    />
  </head>
  <body data-page="game" data-accent="flare">
    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main" class="game wrap mb-page">
      <div class="stage-bar">
        <a class="backlink" href="/">[&lt; ESCAPE TO DIRECTORY]</a>
        <h1 class="stage-bar__title">MARS BASE <span class="mb-sub">// RED DUST</span></h1>
        <span class="stage-bar__meta">
          <span>SOL <b id="bar-sol">1</b></span>
          <span>SESSION T+<b data-session-clock>00:00</b></span>
          <button class="hbtn" type="button" data-fullscreen-toggle>FULLSCREEN</button>
        </span>
      </div>

      <div class="mb-stage" id="stage" data-stage-fill>
        <canvas id="world" class="mb-canvas" aria-label="Mars surface view" tabindex="0"></canvas>

        <!-- HUD overlay -->
        <div class="mb-hud" id="hud" hidden>
          <section class="hud-vitals" id="hud-vitals" aria-label="Suit vitals"></section>
          <section class="hud-objective" id="hud-objective" aria-live="polite"></section>

          <section class="hud-tr" aria-label="Clock and map">
            <div class="hud-clock">
              <span class="hud-clock__sol">SOL <b id="hud-sol">1</b></span>
              <span class="hud-clock__time" id="hud-time">06:00</span>
              <span class="hud-clock__speed" id="hud-speed">1×</span>
            </div>
            <canvas class="hud-mini" id="hud-mini" width="128" height="128" aria-label="Minimap"></canvas>
            <div class="hud-weather" id="hud-weather"></div>
          </section>

          <section class="hud-alerts" id="hud-alerts" aria-live="assertive"></section>
          <section class="hud-base" id="hud-base" aria-label="Base status"></section>
          <section class="hud-context" id="hud-context" aria-live="off"></section>
          <nav class="hud-hotbar" id="hud-hotbar" aria-label="Hotbar"></nav>
          <div class="hud-buttons" id="hud-buttons">
            <button type="button" class="hbtn" data-open="inventory" title="Inventory & crafting [Tab]">INV</button>
            <button type="button" class="hbtn" data-open="build" title="Build [B]">BUILD</button>
            <button type="button" class="hbtn" data-open="research" title="Research [T]">RSRCH</button>
            <button type="button" class="hbtn" data-open="map" title="Map [M]">MAP</button>
            <button type="button" class="hbtn" data-open="journal" title="Journal [J]">LOG</button>
            <button type="button" class="hbtn" data-open="menu" title="Menu [Esc]">MENU</button>
          </div>
          <div class="hud-pause" id="hud-pause" hidden>PAUSED <small>[SPACE]</small></div>
          <div class="hud-sleep" id="hud-sleep" hidden>SLEEPING…</div>
          <div class="hud-dead" id="hud-vignette" aria-hidden="true"></div>
        </div>

        <!-- Panels -->
        <div class="mb-panel" id="panel" hidden role="dialog" aria-modal="false" aria-labelledby="panel-title">
          <div class="mb-panel__frame">
            <header class="mb-panel__head">
              <nav class="mb-tabs" id="panel-tabs" role="tablist"></nav>
              <h2 class="sr-only" id="panel-title">Panel</h2>
              <button type="button" class="hbtn mb-panel__close" id="panel-close" aria-label="Close panel">[X]</button>
            </header>
            <div class="mb-panel__body" id="panel-body"></div>
          </div>
        </div>

        <!-- Title / mode select -->
        <div class="mb-title" id="title-screen">
          <div class="mb-title__inner">
            <p class="mb-title__kicker">HELIOS-3 // ACIDALIA PLANITIA</p>
            <h2 class="mb-title__logo">MARS<br />BASE</h2>
            <p class="mb-title__tag">The crew left. You didn't.</p>
            <div class="mb-title__menu" id="title-menu"></div>
            <div class="mb-title__fame" id="title-fame"></div>
          </div>
          <canvas class="mb-title__bg" id="title-bg" aria-hidden="true"></canvas>
        </div>
      </div>

      <div class="console mb-console">
        <span class="console__group"><span class="console__label">MOVE</span><span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span></span>
        <span class="console__group"><span class="console__label">USE</span><span>L-CLICK</span></span>
        <span class="console__group"><span class="console__label">INTERACT</span><span class="kbd">E</span><span>/ R-CLICK</span></span>
        <span class="console__group"><span class="console__label">EAT</span><span class="kbd">Q</span></span>
        <span class="console__group"><span class="console__label">TOOLS</span><span class="kbd">1</span>–<span class="kbd">9</span></span>
        <span class="console__group"><span class="console__label">PANELS</span><span class="kbd">TAB</span><span class="kbd">B</span><span class="kbd">T</span><span class="kbd">M</span><span class="kbd">J</span></span>
        <span class="console__group"><span class="console__label">ROVER</span><span class="kbd">F</span></span>
        <span class="console__group"><span class="console__label">TIME</span><span class="kbd">SPACE</span><span class="kbd">[</span><span class="kbd">]</span></span>
        <span class="console__group"><span class="console__label">ZOOM</span><span class="kbd">Z</span></span>
      </div>
    </main>

    <script type="module" src="/games/mars-base/main.js"></script>
  </body>
</html>
