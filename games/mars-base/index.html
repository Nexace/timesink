<!doctype html>
<html lang="en" data-accent="flare" class="crt-on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MARS BASE — SYS://ARCADE.NET</title>
    <meta
      name="description"
      content="A turn-based Mars colony experiment. Manage power, water, oxygen, ore and credits across sols, survive dust storms and meteors, and grow a self-sustaining colony of fifty."
    />
    <meta name="theme-color" content="#050508" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://timesink.vercel.app/games/mars-base" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SYS://ARCADE.NET" />
    <meta property="og:title" content="MARS BASE — SYS://ARCADE.NET" />
    <meta
      property="og:description"
      content="Build a colony one sol at a time. Oxygen is a suggestion until it isn't."
    />
    <meta property="og:url" content="https://timesink.vercel.app/games/mars-base" />
    <meta property="og:image" content="https://timesink.vercel.app/assets/mars-base-og.png" />
    <meta property="og:image:alt" content="MARS BASE — turn-based colony experiment" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MARS BASE — SYS://ARCADE.NET" />
    <meta name="twitter:description" content="Build a colony one sol at a time. Oxygen is a suggestion until it isn't." />
    <meta name="twitter:image" content="https://timesink.vercel.app/assets/mars-base-og.png" />
    <link rel="stylesheet" href="/shared/tokens.css" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/games/mars-base/game.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050508'/%3E%3Cpath d='M4 13V9a4 4 0 0 1 8 0v4' fill='none' stroke='%23FF4900' stroke-width='2'/%3E%3Crect x='7' y='5' width='2' height='2' fill='%23FF4900'/%3E%3C/svg%3E"
    />
  </head>
  <body data-page="game" data-accent="flare">
    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main" class="game wrap">
      <div class="stage-bar">
        <a class="backlink" href="/">[&lt; ESCAPE TO DIRECTORY]</a>
        <h1 class="stage-bar__title">MARS BASE</h1>
        <span class="stage-bar__meta">
          <span>SOL <b id="sol">1</b></span>
          <span>SESSION T+<b data-session-clock>00:00</b></span>
          <button class="hbtn" type="button" data-fullscreen-toggle>FULLSCREEN</button>
        </span>
      </div>

      <div class="gamerow">
        <span class="gamerow__pop" aria-label="Population over capacity">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.4a3.2 3.2 0 0 1 0 5.2"/><path d="M18.5 20a6 6 0 0 0-2.6-4.9"/></svg>
          <span id="pop">2/4</span>
        </span>
        <span class="gamerow__badges">
          <span id="doctrine-badge"></span>
          <span id="mode-badge"></span>
        </span>
        <span class="gamerow__status" id="status-banner" role="status"></span>
      </div>

      <section class="resources" id="resources" aria-label="Resources" aria-live="off"></section>
      <p class="sr-only" id="res-summary" role="status"></p>

      <div class="layout">
        <section class="panel" aria-label="Structures">
          <div class="panel__head"><h2 class="panel__title">STRUCTURES</h2></div>
          <div class="buildings__list" id="buildings"></div>
        </section>

        <aside class="side">
          <section class="panel" aria-label="Controls">
            <div class="panel__body controls">
              <button id="btn-advance" type="button" class="btn btn--primary controls__primary">
                ADVANCE SOL <span class="kbd">SPACE</span>
              </button>
              <div class="controls__row">
                <button id="btn-undo" type="button" class="btn">UNDO <span class="kbd">U</span></button>
                <button id="btn-help" type="button" class="btn btn--ghost">HELP <span class="kbd">?</span></button>
              </div>
              <div class="controls__row controls__row--tight">
                <button id="btn-export" type="button" class="btn btn--ghost btn--sm">EXPORT</button>
                <button id="btn-import" type="button" class="btn btn--ghost btn--sm">IMPORT</button>
                <button id="btn-daily" type="button" class="btn btn--ghost btn--sm">DAILY</button>
              </div>
              <button id="btn-reset" type="button" class="btn btn--danger btn--sm">ABANDON COLONY</button>
            </div>
          </section>

          <section class="panel" aria-label="Next sol preview">
            <div class="panel__head"><h2 class="panel__title">PROJ // NEXT SOL</h2></div>
            <div class="panel__body">
              <div id="preview-rows"></div>
              <div id="preview-notes"></div>
              <div id="win-progress"></div>
            </div>
          </section>

          <section class="panel" aria-label="Colony log">
            <div class="panel__head"><h2 class="panel__title">COLONY LOG</h2></div>
            <ul class="log__list" id="log"></ul>
          </section>

          <section class="panel" aria-label="Top operators">
            <div class="panel__head"><h2 class="panel__title">TOP OPERATORS</h2></div>
            <div class="hs-wrap" id="hall-of-fame"></div>
          </section>
        </aside>
      </div>

      <div class="console">
        <span class="console__group"><span class="console__label">OBJECTIVE</span><span>50 COLONISTS + 10 SUSTAINED SOLS</span></span>
        <span class="console__group"><span class="console__label">KEYS</span><span class="kbd">SPACE</span><span>ADV</span><span class="kbd">1</span><span>–</span><span class="kbd">0</span><span>BUILD</span><span class="kbd">U</span><span>UNDO</span></span>
      </div>
    </main>

    <script type="module" src="/games/mars-base/ui.js"></script>
  </body>
</html>
